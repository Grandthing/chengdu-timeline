<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทริปเฉิงตู">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>คำจีนทริปเฉิงตู</title>
<style>
/* layout: one scrolling column of day sections; each row = Thai label left, Chinese + copy button; sticky day chips on top */
:root{--bg:#f6f7f5;--card:#ffffff;--fg:#1c2421;--muted:#5d6b65;--line:#dde3df;--accent:#0b6b55;--accent-fg:#ffffff;--ok:#1d7a3a;
--font:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2320;--fg:#e8eeeb;--muted:#9fb0a8;--line:#2c3833;--accent:#4fc7a8;--accent-fg:#06231b;--ok:#6fd58c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2320;--fg:#e8eeeb;--muted:#9fb0a8;--line:#2c3833;--accent:#4fc7a8;--accent-fg:#06231b;--ok:#6fd58c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:.92rem;white-space:pre-line}
.py{display:block;font-size:.8rem;color:var(--accent);font-style:italic;line-height:1.3;margin:1px 0 2px;word-break:break-word}
.big .bigpy{font-size:clamp(1rem,4.5vw,1.6rem);font-weight:500;color:var(--muted);text-align:center;margin:0;word-break:break-word}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line)}
nav a.home{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.back{display:inline-block;margin-bottom:6px;color:var(--accent)}
nav a{flex:none;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:22px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 56px)}
h2{font-size:1.05rem;margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.txt{flex:1;min-width:0}
.th{font-size:.82rem;color:var(--muted)}
.zh{font-size:1.15rem;font-weight:600;word-break:break-all;user-select:all;-webkit-user-select:all}
button{flex:none;font:inherit;font-size:.85rem;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);padding:9px 12px;min-width:74px;cursor:pointer}
button.done{background:var(--ok)}
.big{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px}
.big p{font-size:clamp(2rem,9vw,4rem);font-weight:700;text-align:center;margin:0;word-break:break-all}
.show{background:transparent;color:var(--accent);border:1px solid var(--accent);min-width:0;padding:9px 10px}
html{margin:0}body{margin:0}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← กลับแผนหลัก</a>
<h1>คำจีนทริปเฉิงตู 13–19 พ.ย.</h1>
<p class="sub">กด "คัดลอก" แล้วไปวางใน Didi, Amap หรือ Dianping ได้เลย · กด "โชว์" เพื่อขยายให้คนขับหรือพนักงานดู</p>
<nav id="nav"><a class="home" href="index.html">← แผนหลัก</a></nav>
<div id="out"></div>
</div>
<div class="big" id="big" hidden><p id="bigt"></p><p class="bigpy" id="bigpy"></p><button id="bigc" type="button">ปิด</button></div>
<script src="words-data.js"></script>
<script src="pinyin-data.js"></script>
<script>
const D=window.WORDS;
const nav=document.getElementById('nav'),out=document.getElementById('out');
D.forEach(([t,id,rows,note])=>{
  const a=document.createElement('a');a.href='#'+id;a.textContent=t;nav.appendChild(a);
  const s=document.createElement('section');s.id=id;
  const h=document.createElement('h2');h.textContent=t;s.appendChild(h);
  if(note){const n=document.createElement('p');n.className='note';n.textContent=note;s.appendChild(n)}
  const l=document.createElement('div');l.className='list';
  rows.forEach(([th,zh])=>{
    const r=document.createElement('div');r.className='row';
    const x=document.createElement('div');x.className='txt';
    const p1=document.createElement('div');p1.className='th';p1.textContent=th;
    const p2=document.createElement('div');p2.className='zh';p2.textContent=zh;
    const pp=document.createElement('div');pp.className='py';pp.textContent=(window.PY||{})[zh]||'';
    x.append(p1);if(pp.textContent)x.append(pp);x.append(p2);
    const sh=document.createElement('button');sh.type='button';sh.className='show';sh.textContent='โชว์';
    sh.addEventListener('click',()=>{document.getElementById('bigt').textContent=zh;document.getElementById('bigpy').textContent=(window.PY||{})[zh]||'';document.getElementById('big').hidden=false});
    const b=document.createElement('button');b.type='button';b.textContent='คัดลอก';
    b.addEventListener('click',()=>{
      const ok=()=>{b.textContent='คัดลอกแล้ว';b.classList.add('done');setTimeout(()=>{b.textContent='คัดลอก';b.classList.remove('done')},1500)};
      const fb=()=>{const g=window.getSelection(),rg=document.createRange();rg.selectNodeContents(p2);g.removeAllRanges();g.addRange(rg);
        try{if(document.execCommand('copy')){ok();return}}catch(e){} b.textContent='กดค้างเพื่อคัดลอก'};
      try{navigator.clipboard.writeText(zh).then(ok,fb)}catch(e){fb()}
    });
    r.append(x,sh,b);l.appendChild(r);
  });
  s.appendChild(l);out.appendChild(s);
});
document.getElementById('bigc').addEventListener('click',()=>{document.getElementById('big').hidden=true});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
